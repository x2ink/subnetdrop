#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# The user-level Gradle proxy may be unavailable; access approved domestic mirrors directly.
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|*.aliyun.com|*.tencent.com|*.huaweicloud.com|*.npmmirror.com
systemProp.https.nonProxyHosts=localhost|127.*|[::1]|*.aliyun.com|*.tencent.com|*.huaweicloud.com|*.npmmirror.com

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
